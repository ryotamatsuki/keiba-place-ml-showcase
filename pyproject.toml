[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-place-ml-showcase"
version = "0.1.0"
description = "Rights-clean showcase of leakage-conscious P(top3) probability modeling"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
model = ["xgboost>=3.0,<4"]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
